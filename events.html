
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f5fa;
        }

        header {
            background-color: #243b64;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #182945;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            flex: 1;
            min-width: 150px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .form-box, .table-box {
            background-color: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 8px 5px 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background-color: #243b64;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4169a1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #243b64;
            color: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background-color: #243b64;
            color: white;
        }

        @media (max-width: 600px) {
            .container {
                width: 92%;
            }

            nav a {
                display: inline-block;
                margin: 8px;
            }

            input {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage Students, Courses, Attendance and Results</p>
    </header>

    <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#registration">Registration</a>
        <a href="#students">Students</a>
    </nav>

    <div class="container">

        <section id="dashboard">
            <h2>Dashboard</h2>

            <div class="cards">
                <div class="card">
                    <h3>Total Students</h3>
                    <h2 id="totalStudents">0</h2>
                </div>

                <div class="card">
                    <h3>Total Courses</h3>
                    <h2>5</h2>
                </div>

                <div class="card">
                    <h3>Attendance</h3>
                    <h2>Track</h2>
                </div>

                <div class="card">
                    <h3>Results</h3>
                    <h2>Manage</h2>
                </div>
            </div>
        </section>

        <section id="registration" class="form-box">
            <h2>Student Registration</h2>

            <form id="studentForm">
                <input type="text" id="name"
                    placeholder="Student Name" required>

                <input type="text" id="roll"
                    placeholder="Roll Number" required>

                <input type="text" id="course"
                    placeholder="Course" required>

                <button type="submit">Add Student</button>
            </form>
        </section>

        <section id="students" class="table-box">
            <h2>Student Details</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Course</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentList">
                </tbody>
            </table>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 Student Management System</p>
    </footer>

    <script>
        const form = document.getElementById("studentForm");
        const studentList = document.getElementById("studentList");
        const totalStudents = document.getElementById("totalStudents");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const roll = document.getElementById("roll").value.trim();
            const course = document.getElementById("course").value.trim();

            if (!name || !roll || !course) {
                alert("Please fill in all fields.");
                return;
            }

            const row = document.createElement("tr");

            [name, roll, course].forEach(function(value) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actionCell = document.createElement("td");
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", function() {
                row.remove();
                updateCount();
            });

            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);

            studentList.appendChild(row);

            form.reset();
            updateCount();
        });

        function updateCount() {
            totalStudents.textContent = studentList.rows.length;
        }
    </script>

</body>
</html>
